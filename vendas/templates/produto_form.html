<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if produto %}Editar Produto{% else %}Novo Produto{% endif %}</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
            font-size: 0.875rem;
        }

        input {
            width: 100%;
            padding: 0.65rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            padding: 0.75rem 1.5rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>{% if produto %}Editar Produto: {{ produto.codigo_reduzido }}{% else %}Cadastrar Novo Produto{% endif %}</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="codigo_reduzido">Código Reduzido (cdProduto):</label>
                <input type="text" id="codigo_reduzido" name="codigo_reduzido" value="{{ produto.codigo_reduzido|default:'' }}" required>
            </div>

            <div class="form-group">
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" name="descricao" value="{{ produto.descricao|default:'' }}" required>
            </div>

            <div class="form-group">
                <label for="ean">EAN (Código de Barras):</label>
                <input type="text" id="ean" name="ean" value="{{ produto.ean|default:'' }}">
            </div>

            <div class="form-group">
                <label for="preco_unitario">Preço Unitário (R$):</label>
                <input type="number" step="0.01" id="preco_unitario" name="preco_unitario" value="{{ produto.preco_unitario|default:'0.00' }}" required>
            </div>

            <button type="submit">Salvar Produto</button>
        </form>
    </div>

</body>
</html>
